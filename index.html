<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="E-Kisan Market - Agricultural Marketplace">E-Kisan Market - Agricultural Marketplace</title>
  <link rel="stylesheet" href="styles/main.css" />
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .login-page .topbar {
      background: linear-gradient(135deg, rgba(59, 122, 87, 0.1) 0%, rgba(16, 185, 129, 0.1) 100%);
      border-bottom: 2px solid rgba(59, 122, 87, 0.15);
    }

    .login-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeInLogin 0.5s ease-out;
    }

    @keyframes fadeInLogin {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 700px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .login-card h1 {
      font-size: 32px;
      margin: 24px 0 12px;
      color: var(--text);
      font-weight: 700;
    }

    .login-card .subtitle {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .role-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 28px 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .role-card:hover {
      border-color: var(--primary);
      box-shadow: 0 8px 24px rgba(59, 122, 87, 0.15);
      transform: translateY(-4px);
    }

    .role-card.selected {
      border-color: var(--primary);
      background: rgba(59, 122, 87, 0.05);
      box-shadow: 0 0 0 3px rgba(59, 122, 87, 0.1);
    }

    .role-icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: block;
    }

    .login-emoji {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .role-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .role-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-continue {
      padding: 14px 32px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      flex: 1;
      min-width: 200px;
    }

    .btn-continue:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 122, 87, 0.3);
    }

    .btn-continue:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 4px 12px rgba(59, 122, 87, 0.2);
    }

    .btn-continue:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-footer {
      color: var(--muted);
      font-size: 13px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .role-selection-error {
      min-height: 20px;
      color: var(--danger);
    }

    @media (max-width: 768px) {
      .login-card {
        padding: 36px 24px;
      }

      .login-card h1 {
        font-size: 26px;
      }

      .role-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .btn-continue {
        min-width: auto;
      }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
      }

      .login-card h1 {
        font-size: 22px;
        margin: 16px 0 8px;
      }

      .role-icon {
        font-size: 40px;
      }

      .role-name {
        font-size: 16px;
      }
    }
  </style>
</head>

<body class="login-page">
  <header class="topbar">
    <div class="brand" data-i18n="E-Kisan Market">🌾 E-Kisan Market</div>
    <div class="topbar-right">
      <button id="themeToggleBtn" class="btn" type="button">🌙 Dark</button>
      <div class="lang-toggle" data-lang-toggle role="group" aria-label="Language toggle"
        data-i18n-aria="Language toggle">
        <button class="lang-btn active" data-lang="en" type="button" data-i18n="EN">EN</button>
        <span class="lang-sep">|</span>
        <button class="lang-btn" data-lang="mr" type="button" data-i18n="मराठी">मराठी</button>
      </div>
    </div>
  </header>

  <main class="login-content">
    <div class="login-card">
      <div class="login-emoji" aria-hidden="true">🌾</div>
      <h1 data-i18n="Welcome to E-Kisan Market">Welcome to E-Kisan Market</h1>
      <p class="subtitle" data-i18n="Empowering transparent agricultural trade. Select your role to get started.">
        Empowering transparent agricultural trade. Select your role to get started.</p>

      <div class="role-grid" id="roleGrid">
        <div class="role-card" role="button" tabindex="0" data-role="farmer">
          <span class="role-icon">🌱</span>
          <div class="role-name" data-i18n="Farmer">Farmer</div>
          <div class="role-desc" data-i18n="List produce & manage offers">List produce & manage offers</div>
        </div>
        <div class="role-card" role="button" tabindex="0" data-role="buyer">
          <span class="role-icon">🛒</span>
          <div class="role-name" data-i18n="Buyer">Buyer</div>
          <div class="role-desc" data-i18n="Browse & place offers">Browse & place offers</div>
        </div>
        <div class="role-card" role="button" tabindex="0" data-role="middleman">
          <span class="role-icon">🧑‍💼</span>
          <div class="role-name" data-i18n="Middleman">Middleman</div>
          <div class="role-desc" data-i18n="Review & approve listings">Review & approve listings</div>
        </div>
      </div>

      <div class="action-buttons">
        <button class="btn-continue" id="continueBtn" disabled data-i18n="Continue as Selected Role">Continue as
          Selected Role</button>
      </div>
      <div id="roleSelectionError" class="muted role-selection-error" aria-live="polite"></div>

      <div class="login-footer">
        <span data-i18n="Secure • No login required • Demo mode">Secure • No login required • Demo mode</span>
      </div>
    </div>
  </main>
  <script src="scripts/i18n.js"></script>
  <script src="scripts/dataManager.js"></script>
  <script src="scripts/theme.js"></script>
  <script>
    let selectedRole = null;

    document.addEventListener('DOMContentLoaded', () => {
      initThemeToggle();
      const roleCards = document.querySelectorAll('.role-card');
      const roleGrid = document.getElementById('roleGrid');
      const continueBtn = document.getElementById('continueBtn');
      if (roleGrid) {
        roleGrid.addEventListener('click', (e) => {
          const card = e.target.closest('.role-card');
          if (!card) return;
          const role = card.getAttribute('data-role');
          if (role) selectRole(role, card);
        });
      }
      if (continueBtn) {
        continueBtn.addEventListener('click', () => {
          proceedWithRole();
        });
      }
      roleCards.forEach(card => {
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const role = card.getAttribute('data-role');
            selectRole(role, card);
          }
        });
      });
    });

    function selectRole(role, element) {
      selectedRole = role;
      const allCards = document.querySelectorAll('.role-card');
      allCards.forEach(card => card.classList.remove('selected'));
      element.classList.add('selected');
      document.getElementById('continueBtn').disabled = false;
      const errorEl = document.getElementById('roleSelectionError');
      if (errorEl) errorEl.textContent = '';
    }

    function proceedWithRole() {
      if (!selectedRole) {
        const errorEl = document.getElementById('roleSelectionError');
        if (errorEl) {
          errorEl.textContent = t('Please select a role');
          errorEl.setAttribute('data-i18n', 'Please select a role');
        }
        return;
      }

      ensureRole(selectedRole);

      const roles = {
        'farmer': 'farmer-dashboard.html',
        'buyer': 'buyer-dashboard.html',
        'middleman': 'middleman-dashboard.html'
      };

      location.href = roles[selectedRole];
    }
  </script>
</body>

</html>
